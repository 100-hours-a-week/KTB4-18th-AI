[project]
name = "ktb-final-project"
version = "0.1.0"
requires-python = ">=3.12.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "google-genai>=1.0.0",  # 되돌릴 때: "openai>=3.6.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# TODO: 배치 워커 전용으로 할까? essentia/torch가 무거워 API 배포 이미지에는 넣지 않는 방식.
# 설치: uv sync --group worker
worker = [
    "numpy<2",
    # 최신(2.1b6.dev1438)은 cp314 휠만 배포하는 깨진 릴리스라 그 직전 버전으로 고정
    "essentia-tensorflow==2.1b6.dev1389",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "torch",
    "torchvision",
    "laion-clap",
    "imageio-ffmpeg",
    "sqlalchemy",
]
