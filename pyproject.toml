[project]
name = "ktb-final-project"
version = "0.1.0"
requires-python = ">=3.12.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# (논의사항) 배치 워커 전용으로 할까? essentia/torch가 무거워 API 배포 이미지에는 넣지 않는 방식.
# 설치: uv sync --group worker
worker = [
    "numpy<2",
    "essentia-tensorflow",
    "torch",
    "torchvision",
    "laion-clap",
    "imageio-ffmpeg",
    "sqlalchemy",
    "psycopg",
]
