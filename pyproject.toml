[project]
name = "ktb-final-project"
version = "0.1.0"
requires-python = ">=3.12.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=0.2.0",
    "numpy",  # pgvector 검색 결과 벡터 연산(db/search.py, db/models.py)에 사용
    "openai>=3.6.0",
    "pgvector>=0.5.0",  # 요청마다 실행되는 pgvector 코사인 검색(db/search.py)에 필요
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "sqlalchemy",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# gemini-embedding-2로 전환하며 CLAP(laion-clap·torch·torchvision)은 완전히 제거했다.
# EffNet 무드 태그 추출은 로컬에서만 돌리고 결과만 Postgres로 옮기는 방식이라
# AWS 서버 이미지에는 넣지 않는다.
# 설치: uv sync --group worker
worker = [
    "numpy<2",  # essentia-tensorflow가 numpy 2.x를 아직 지원하지 않는다
    # 최신(2.1b6.dev1438)은 cp314 휠만 배포하는 깨진 릴리스라 그 직전 버전으로 고정
    "essentia-tensorflow==2.1b6.dev1389",
]
